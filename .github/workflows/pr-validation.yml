name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'carl-app/**'
      - 'carl-infrastructure/**'
      - '.github/workflows/**'

env:
  TERRAFORM_VERSION: '1.6.0'
  PYTHON_VERSION: '3.11'

jobs:
  # Python linting and testing
  python-validation:
    name: Python Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd carl-app
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with pylint
        run: |
          cd carl-app/src
          pylint --rcfile=../../.pylintrc \
            --disable=C,R,W \
            --max-line-length=120 \
            handlers/ services/ knowledge/ utils/ || true

      - name: Lint with flake8
        run: |
          cd carl-app
          flake8 src/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Type checking with mypy
        run: |
          cd carl-app
          mypy src/ --ignore-missing-imports || true

      - name: Run unit tests
        run: |
          cd carl-app
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: carl-app/coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Terraform validation
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - carl-infrastructure/core
          - carl-infrastructure/modules/monitoring
          - carl-infrastructure/modules/bootstrap
          - carl-infrastructure/modules/reporting
          - carl-infrastructure/modules/foundation
          - carl-infrastructure/modules/drift
          - carl-infrastructure/modules/remediation
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create Placeholder Lambda Package
        if: matrix.path == 'carl-infrastructure/core'
        run: |
          # Create placeholder lambda.zip for validation
          # Real package with dependencies is created in deploy job
          cd ${{ matrix.path }}
          echo '{"dummy": "placeholder for validation"}' > dummy.txt
          zip lambda.zip dummy.txt
          rm dummy.txt

      - name: Terraform Format Check
        run: |
          cd ${{ matrix.path }}
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          cd ${{ matrix.path }}
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd ${{ matrix.path }}
          terraform validate

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run tfsec on Terraform
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: carl-infrastructure
          soft_fail: true

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: carl-infrastructure
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif

  # Lambda packaging test
  lambda-package:
    name: Lambda Package Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd carl-app
          pip install -r requirements.txt -t src/

      - name: Package Lambda
        run: |
          cd carl-app/src
          zip -r ../../lambda-test.zip . -x "*.pyc" -x "__pycache__/*" -x "tests/*"

      - name: Check package size
        run: |
          SIZE=$(stat -f%z lambda-test.zip)
          echo "Lambda package size: $SIZE bytes"
          if [ $SIZE -gt 52428800 ]; then
            echo "ERROR: Lambda package is larger than 50MB limit"
            exit 1
          fi

      - name: Upload Lambda package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda-test.zip
          retention-days: 7

  # Terraform plan for all environments
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validation]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      matrix:
        environment: [dev, qa, prod]
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Package Lambda
        run: |
          cd carl-app/src
          zip -r ../../carl-infrastructure/core/lambda.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Terraform Init
        run: |
          cd carl-infrastructure/core
          terraform init

      - name: Terraform Plan
        id: plan
        run: |
          cd carl-infrastructure/core
          terraform plan \
            -var="environment=${{ matrix.environment }}" \
            -out=tfplan-${{ matrix.environment }} \
            -no-color
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan 📖 - ${{ matrix.environment }}
            \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Documentation validation
  docs-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

      - name: Validate markdown format
        uses: avto-dev/markdown-lint@v1
        with:
          args: '*.md carl-app/*.md carl-infrastructure/*.md'
          config: '.github/markdownlint-config.json'
        continue-on-error: true

  # PR summary
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [python-validation, terraform-validation, security-scan, lambda-package, terraform-plan]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "### PR Validation Summary 📋" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Validation | ${{ needs.python-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Validation | ${{ needs.terraform-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda Package | ${{ needs.lambda-package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Plan | ${{ needs.terraform-plan.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.python-validation.result == 'failure' ||
          needs.terraform-validation.result == 'failure' ||
          needs.lambda-package.result == 'failure' ||
          needs.terraform-plan.result == 'failure'
        run: |
          echo "❌ One or more validation jobs failed"
          exit 1
