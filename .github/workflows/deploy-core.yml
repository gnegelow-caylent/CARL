name: Deploy CARL Core

on:
  push:
    branches:
      - main      # Prod deployments
      - develop   # Dev deployments
      - qa        # QA deployments
    paths:
      - 'carl-infrastructure/core/**'
      - 'carl-app/src/**'
      - '.github/workflows/deploy-core.yml'
  pull_request:
    branches:
      - main
      - develop
      - qa
    paths:
      - 'carl-infrastructure/core/**'
      - 'carl-app/src/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: 'dev'

env:
  TERRAFORM_VERSION: '1.6.0'
  AWS_REGION: us-east-1

jobs:
  # Validate Terraform and Python code
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: |
          cd carl-infrastructure/core
          terraform fmt -check -recursive

      - name: Create Placeholder Lambda Package
        run: |
          # Create placeholder lambda.zip for validation
          # Real package with dependencies is created in deploy job
          cd carl-infrastructure/core
          echo '{"dummy": "placeholder for validation"}' > dummy.txt
          zip lambda.zip dummy.txt
          rm dummy.txt

      - name: Terraform Init
        run: |
          cd carl-infrastructure/core
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd carl-infrastructure/core
          terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd carl-app
          pip install -r requirements.txt
          pip install pylint pytest

      - name: Lint Python Code
        run: |
          cd carl-app/src
          pylint --disable=C,R,W handlers/ services/ knowledge/ utils/ || true

      - name: Run Python Tests
        run: |
          cd carl-app
          pytest tests/ || echo "No tests yet"

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Plan for PR
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate, security]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      matrix:
        include:
          - environment: dev
            role_arn_secret: AWS_ROLE_ARN_DEV
          - environment: qa
            role_arn_secret: AWS_ROLE_ARN_QA
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[matrix.role_arn_secret] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: |
          cd carl-infrastructure/core
          terraform init

      - name: Terraform Plan
        id: plan
        run: |
          cd carl-infrastructure/core
          terraform plan \
            -var="environment=${{ matrix.environment }}" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖 - ${{ matrix.environment }}
            \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # Deploy to Dev
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    needs: [validate, security]
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Package Lambda
        run: |
          # Install dependencies into src/ directory
          # IMPORTANT: Terraform expects lambda.zip in carl-infrastructure/core/
          # Do NOT use Terraform's data.archive_file as it recreates without dependencies
          pip install -r carl-app/requirements.txt -t carl-app/src/
          # Package everything including dependencies
          cd carl-app/src
          zip -r ../../carl-infrastructure/core/lambda.zip . -x "*.pyc" -x "__pycache__/*" -x "tests/*"

      - name: Terraform Init
        run: |
          cd carl-infrastructure/core
          terraform init

      - name: Terraform Apply
        run: |
          cd carl-infrastructure/core
          terraform apply -auto-approve \
            -var="environment=dev" \
            -var="slack_bot_token=${{ secrets.SLACK_BOT_TOKEN_DEV }}" \
            -var="slack_signing_secret=${{ secrets.SLACK_SIGNING_SECRET_DEV }}"

      - name: Output Deployment Info
        run: |
          cd carl-infrastructure/core
          echo "### Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoint:** $(terraform output -raw api_endpoint)" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda Function:** $(terraform output -raw lambda_function_name)" >> $GITHUB_STEP_SUMMARY

  # Run integration tests after dev deployment
  integration-tests-dev:
    name: Integration Tests (Dev)
    needs: deploy-dev
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/integration-tests.yml
    with:
      environment: dev
    secrets: inherit

  # Deploy to QA
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/qa') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa')
    needs: [validate, security]
    environment: qa
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_QA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Package Lambda
        run: |
          # Install dependencies into src/ directory
          # IMPORTANT: Terraform expects lambda.zip in carl-infrastructure/core/
          # Do NOT use Terraform's data.archive_file as it recreates without dependencies
          pip install -r carl-app/requirements.txt -t carl-app/src/
          # Package everything including dependencies
          cd carl-app/src
          zip -r ../../carl-infrastructure/core/lambda.zip . -x "*.pyc" -x "__pycache__/*" -x "tests/*"

      - name: Terraform Init
        run: |
          cd carl-infrastructure/core
          terraform init

      - name: Terraform Apply
        run: |
          cd carl-infrastructure/core
          terraform apply -auto-approve \
            -var="environment=qa" \
            -var="slack_bot_token=${{ secrets.SLACK_BOT_TOKEN_QA }}" \
            -var="slack_signing_secret=${{ secrets.SLACK_SIGNING_SECRET_QA }}"

  # Deploy to Prod
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    needs: [validate, security]
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Package Lambda
        run: |
          # Install dependencies into src/ directory
          # IMPORTANT: Terraform expects lambda.zip in carl-infrastructure/core/
          # Do NOT use Terraform's data.archive_file as it recreates without dependencies
          pip install -r carl-app/requirements.txt -t carl-app/src/
          # Package everything including dependencies
          cd carl-app/src
          zip -r ../../carl-infrastructure/core/lambda.zip . -x "*.pyc" -x "__pycache__/*" -x "tests/*"

      - name: Terraform Init
        run: |
          cd carl-infrastructure/core
          terraform init

      - name: Terraform Plan
        run: |
          cd carl-infrastructure/core
          terraform plan \
            -var="environment=prod" \
            -var="slack_bot_token=${{ secrets.SLACK_BOT_TOKEN_PROD }}" \
            -var="slack_signing_secret=${{ secrets.SLACK_SIGNING_SECRET_PROD }}" \
            -out=tfplan

      - name: Wait for Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ secrets.PROD_APPROVERS }}
          minimum-approvals: 2

      - name: Terraform Apply
        run: |
          cd carl-infrastructure/core
          terraform apply tfplan

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 CARL Core deployed to production!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CARL Core - Production Deployment*\n\n✅ Deployment successful!"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
