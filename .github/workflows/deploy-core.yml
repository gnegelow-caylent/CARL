name: Deploy CARL Core
# Optimized: Docker layer caching, parallel builds, Python caching, regression tests

on:
  push:
    branches:
      # NOTE: main does NOT auto-deploy to prod - use workflow_dispatch for prod
      - develop   # Dev deployments
      - qa        # QA deployments
    paths:
      - 'carl-infrastructure/core/**'
      - 'carl-infrastructure/modules/**'
      - 'carl-infrastructure/environments/**'
      - 'carl-infrastructure/agentcore-code/**'
      - 'carl-app/src/**'
      - 'carl-app/requirements.txt'
      - 'carl-app/Dockerfile'
      - 'carl-app/compliance-frameworks/**'
      - '.github/workflows/deploy-core.yml'
  pull_request:
    branches:
      - main
      - develop
      - qa
    paths:
      - 'carl-infrastructure/core/**'
      - 'carl-infrastructure/modules/**'
      - 'carl-infrastructure/environments/**'
      - 'carl-infrastructure/agentcore-code/**'
      - 'carl-app/src/**'
      - 'carl-app/requirements.txt'
      - 'carl-app/Dockerfile'
      - 'carl-app/compliance-frameworks/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: 'dev'
      skip_tests:
        description: 'Skip regression tests'
        required: false
        type: boolean
        default: false

env:
  TERRAFORM_VERSION: '1.6.0'
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'

jobs:
  # Detect what changed to skip unnecessary work
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app_code: ${{ steps.filter.outputs.app_code }}
      terraform: ${{ steps.filter.outputs.terraform }}
      agentcore: ${{ steps.filter.outputs.agentcore }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app_code:
              - 'carl-app/src/**'
              - 'carl-app/requirements.txt'
              - 'carl-app/Dockerfile'
            terraform:
              - 'carl-infrastructure/**/*.tf'
              - 'carl-infrastructure/**/*.tfvars'
            agentcore:
              - 'carl-infrastructure/agentcore-code/**'
            mcp_servers:
              - 'carl-infrastructure/modules/mcp-gateway/mcp-servers/**'

  # Validate Terraform and Python code
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: |
          cd carl-infrastructure/core
          terraform fmt -check -recursive

      - name: Create Placeholder Lambda Package
        run: |
          # Create placeholder in carl-app/ where modules expect it
          cd carl-app
          echo '{"dummy": "placeholder for validation"}' > dummy.txt
          zip lambda.zip dummy.txt
          rm dummy.txt

      - name: Terraform Init & Validate
        run: |
          cd carl-infrastructure/core
          terraform init -backend=false
          terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'carl-app/requirements*.txt'

      - name: Install Python Dependencies
        run: |
          cd carl-app
          pip install -r requirements.txt
          pip install pylint pytest

      - name: Lint Python Code
        run: |
          cd carl-app/src
          pylint --disable=C,R,W handlers/ services/ knowledge/ utils/ || true

  # Unit tests with coverage
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'carl-app/requirements*.txt'

      - name: Install Dependencies
        run: |
          cd carl-app
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          cd carl-app
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing || echo "Some tests may have failed"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: carl-app/coverage.xml
          fail_ci_if_error: false

  # Security scanning (runs in parallel with validate)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Build all containers in parallel (only when app code changes)
  build-containers:
    name: Build Containers
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: |
      needs.changes.outputs.app_code == 'true' ||
      needs.changes.outputs.agentcore == 'true' ||
      needs.changes.outputs.mcp_servers == 'true' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    outputs:
      lambda_image_uri: ${{ steps.build.outputs.lambda_image_uri }}
      agentcore_ask_tag: ${{ steps.build.outputs.agentcore_ask_tag }}
      agentcore_architect_tag: ${{ steps.build.outputs.agentcore_architect_tag }}
      mcp_ecr_repo: ${{ steps.build.outputs.mcp_ecr_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Build and Push All Containers (Parallel)
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: carl-lambda
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building all containers in parallel..."

          # Build Lambda container (AMD64) in background
          # --provenance=false prevents OCI manifest issues that Lambda doesn't support
          (
            echo "🔨 Building Lambda container..."
            cd carl-app
            docker buildx build --platform linux/amd64 \
              --provenance=false \
              --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:lambda-cache \
              --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:lambda-cache,mode=max \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:lambda-$IMAGE_TAG \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:lambda \
              --push .
            echo "✓ Lambda container pushed"
          ) &
          LAMBDA_PID=$!

          # Build Ask agent container (ARM64) in background
          (
            echo "🔨 Building Ask agent container..."
            cd carl-infrastructure/agentcore-code/ask-agent
            docker buildx build --platform linux/arm64 \
              --provenance=false \
              --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:agentcore-ask-cache \
              --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:agentcore-ask-cache,mode=max \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:agentcore-ask-$IMAGE_TAG \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:agentcore-ask \
              --push .
            echo "✓ Ask agent container pushed"
          ) &
          ASK_PID=$!

          # Build Architect agent container (ARM64) in background
          (
            echo "🔨 Building Architect agent container..."
            cd carl-infrastructure/agentcore-code/architect-agent
            docker buildx build --platform linux/arm64 \
              --provenance=false \
              --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:agentcore-architect-cache \
              --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:agentcore-architect-cache,mode=max \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:agentcore-architect-$IMAGE_TAG \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:agentcore-architect \
              --push .
            echo "✓ Architect agent container pushed"
          ) &
          ARCHITECT_PID=$!

          # Build MCP Server containers (AMD64) in background
          # ECR repo is created by Terraform (enable_mcp_gateway=true)
          MCP_REPO="carl-mcp-servers"

          # Check if MCP repo exists (created by Terraform when enable_mcp_gateway=true)
          if aws ecr describe-repositories --repository-names $MCP_REPO 2>/dev/null; then
            echo "📦 MCP ECR repository exists, building MCP containers..."
          else
            echo "⚠️ MCP ECR repository not found. Set enable_mcp_gateway=true in Terraform to enable."
            echo "Skipping MCP container builds."
            MCP_GITHUB_PID=""
            MCP_MEMORY_PID=""
            MCP_TERRAFORM_PID=""
          fi

          # Only build MCP containers if repo exists
          if aws ecr describe-repositories --repository-names $MCP_REPO 2>/dev/null; then
          (
            echo "🔨 Building GitHub MCP container..."
            cd carl-infrastructure/modules/mcp-gateway/mcp-servers/github
            docker buildx build --platform linux/amd64 \
              --provenance=false \
              -t $ECR_REGISTRY/$MCP_REPO:github-latest \
              -t $ECR_REGISTRY/$MCP_REPO:github-$IMAGE_TAG \
              --push .
            echo "✓ GitHub MCP container pushed"
          ) &
          MCP_GITHUB_PID=$!

          (
            echo "🔨 Building Memory MCP container..."
            cd carl-infrastructure/modules/mcp-gateway/mcp-servers/memory
            docker buildx build --platform linux/amd64 \
              --provenance=false \
              -t $ECR_REGISTRY/$MCP_REPO:memory-latest \
              -t $ECR_REGISTRY/$MCP_REPO:memory-$IMAGE_TAG \
              --push .
            echo "✓ Memory MCP container pushed"
          ) &
          MCP_MEMORY_PID=$!

          (
            echo "🔨 Building Terraform MCP container..."
            cd carl-infrastructure/modules/mcp-gateway/mcp-servers/terraform
            docker buildx build --platform linux/amd64 \
              --provenance=false \
              -t $ECR_REGISTRY/$MCP_REPO:terraform-latest \
              -t $ECR_REGISTRY/$MCP_REPO:terraform-$IMAGE_TAG \
              --push .
            echo "✓ Terraform MCP container pushed"
          ) &
          MCP_TERRAFORM_PID=$!
          fi  # End of MCP container builds

          # Wait for all builds
          FAILED=0
          wait $LAMBDA_PID || FAILED=1
          wait $ASK_PID || FAILED=1
          wait $ARCHITECT_PID || FAILED=1

          # Wait for MCP builds only if they were started
          if [ -n "$MCP_GITHUB_PID" ]; then
            wait $MCP_GITHUB_PID || FAILED=1
            wait $MCP_MEMORY_PID || FAILED=1
            wait $MCP_TERRAFORM_PID || FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "❌ One or more container builds failed"
            exit 1
          fi

          echo "✅ All containers built and pushed successfully"

          # Set outputs
          echo "lambda_image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:lambda-$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "agentcore_ask_tag=agentcore-ask-$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "agentcore_architect_tag=agentcore-architect-$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "mcp_ecr_repo=$ECR_REGISTRY/$MCP_REPO" >> $GITHUB_OUTPUT

  # Plan for PR
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate, security, unit-tests]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      matrix:
        include:
          - environment: dev
            role_arn_secret: AWS_ROLE_ARN_DEV
          - environment: qa
            role_arn_secret: AWS_ROLE_ARN_QA
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[matrix.role_arn_secret] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create Placeholder Lambda Package
        run: |
          # Create placeholder in carl-app/ where modules expect it
          cd carl-app
          echo '{"dummy": "placeholder"}' > dummy.txt
          zip lambda.zip dummy.txt
          rm dummy.txt

      - name: Terraform Init & Plan
        id: plan
        run: |
          cd carl-infrastructure/core
          terraform init
          terraform plan \
            -var="environment=${{ matrix.environment }}" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖 - ${{ matrix.environment }}
            \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # Deploy to Dev
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    needs: [validate, security, unit-tests, build-containers]
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create Placeholder Lambda Package
        run: |
          # Create placeholder in carl-app/ where modules expect it
          cd carl-app
          echo '{"dummy": "placeholder for zip-based lambdas"}' > dummy.txt
          zip lambda.zip dummy.txt
          rm dummy.txt

      - name: Terraform Init
        run: |
          cd carl-infrastructure/core
          terraform init

      - name: Terraform Apply
        run: |
          cd carl-infrastructure/core
          terraform apply -auto-approve \
            -var="environment=dev" \
            -var="enable_foundation=true" \
            -var="enable_mcp_gateway=true" \
            -var="lambda_image_uri=${{ needs.build-containers.outputs.lambda_image_uri }}" \
            -var="agentcore_image_tag=${{ needs.build-containers.outputs.agentcore_ask_tag }}" \
            -var="agentcore_architect_image_tag=${{ needs.build-containers.outputs.agentcore_architect_tag }}" \
            -var="slack_bot_token=${{ secrets.SLACK_BOT_TOKEN_DEV }}" \
            -var="slack_signing_secret=${{ secrets.SLACK_SIGNING_SECRET_DEV }}"

      - name: Output Deployment Info
        run: |
          cd carl-infrastructure/core
          echo "### Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoint:** $(terraform output -raw api_endpoint)" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda Function:** $(terraform output -raw lambda_function_name)" >> $GITHUB_STEP_SUMMARY

  # Regression tests after dev deployment
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'carl-app/requirements*.txt'

      - name: Install Dependencies
        run: |
          cd carl-app
          pip install -r requirements-dev.txt
          pip install pytest-timeout requests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Get API Endpoint
        id: api
        run: |
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='carl-dev-api'].ApiId" --output text)
          API_ENDPOINT=$(aws apigatewayv2 get-api --api-id "$API_ID" --query "ApiEndpoint" --output text)
          echo "endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Run Regression Tests
        env:
          CARL_API_ENDPOINT: ${{ steps.api.outputs.endpoint }}
        run: |
          cd carl-app
          pytest tests/regression/ -v --timeout=60 || true

      - name: Health Check
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.api.outputs.endpoint }}/health")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Health check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Health check failed with status: $RESPONSE" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Lambda Smoke Test
        run: |
          FUNCTION_NAME="carl-dev-api"

          # Verify Lambda exists and is configured correctly
          TIMEOUT=$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query 'Timeout' --output text)
          MEMORY=$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query 'MemorySize' --output text)

          echo "### Lambda Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Timeout: ${TIMEOUT}s" >> $GITHUB_STEP_SUMMARY
          echo "- Memory: ${MEMORY}MB" >> $GITHUB_STEP_SUMMARY

          if [ "$TIMEOUT" -ge 90 ]; then
            echo "✅ Lambda timeout is adequate" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Lambda timeout may be too low" >> $GITHUB_STEP_SUMMARY
          fi

      - name: DynamoDB Tables Check
        run: |
          echo "### DynamoDB Tables" >> $GITHUB_STEP_SUMMARY

          for TABLE in config findings scan-history; do
            if aws dynamodb describe-table --table-name "carl-dev-$TABLE" > /dev/null 2>&1; then
              echo "✅ carl-dev-$TABLE exists" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ carl-dev-$TABLE not found" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # Integration tests (called workflow)
  integration-tests-dev:
    name: Integration Tests (Dev)
    needs: regression-tests
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/integration-tests.yml
    with:
      environment: dev
    secrets: inherit

  # Deploy to QA
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/qa') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa')
    needs: [validate, security, unit-tests, build-containers]
    environment: qa
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_QA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create Placeholder Lambda Package
        run: |
          # Create placeholder in carl-app/ where modules expect it
          cd carl-app
          echo '{"dummy": "placeholder"}' > dummy.txt
          zip lambda.zip dummy.txt
          rm dummy.txt

      - name: Terraform Init & Apply
        run: |
          cd carl-infrastructure/core
          terraform init
          terraform apply -auto-approve \
            -var="environment=qa" \
            -var="lambda_image_uri=${{ needs.build-containers.outputs.lambda_image_uri }}" \
            -var="agentcore_image_tag=${{ needs.build-containers.outputs.agentcore_ask_tag }}" \
            -var="agentcore_architect_image_tag=${{ needs.build-containers.outputs.agentcore_architect_tag }}" \
            -var="slack_bot_token=${{ secrets.SLACK_BOT_TOKEN_QA }}" \
            -var="slack_signing_secret=${{ secrets.SLACK_SIGNING_SECRET_QA }}"

  # Deploy to Prod
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    needs: [validate, security, unit-tests, build-containers]
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create Placeholder Lambda Package
        run: |
          # Create placeholder in carl-app/ where modules expect it
          cd carl-app
          echo '{"dummy": "placeholder"}' > dummy.txt
          zip lambda.zip dummy.txt
          rm dummy.txt

      - name: Terraform Init & Plan
        run: |
          cd carl-infrastructure/core
          terraform init
          terraform plan \
            -var="environment=prod" \
            -var="lambda_image_uri=${{ needs.build-containers.outputs.lambda_image_uri }}" \
            -var="agentcore_image_tag=${{ needs.build-containers.outputs.agentcore_ask_tag }}" \
            -var="agentcore_architect_image_tag=${{ needs.build-containers.outputs.agentcore_architect_tag }}" \
            -var="slack_bot_token=${{ secrets.SLACK_BOT_TOKEN_PROD }}" \
            -var="slack_signing_secret=${{ secrets.SLACK_SIGNING_SECRET_PROD }}" \
            -out=tfplan

      - name: Wait for Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ secrets.PROD_APPROVERS }}
          minimum-approvals: 2

      - name: Terraform Apply
        run: |
          cd carl-infrastructure/core
          terraform apply tfplan

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 CARL Core deployed to production!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CARL Core - Production Deployment*\n\n✅ Deployment successful!"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
